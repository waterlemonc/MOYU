<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="发现小游戏、解压互动和轻量静态作品。搜一搜，选一个，马上开始摸鱼。" />
    <title>MOYU 摸鱼指挥部</title>
    <link rel="stylesheet" href="assets/css/home.css" />
    <link rel="stylesheet" href="assets/css/catalog.css" />
  </head>
  <body>
    <a class="skip-link" href="#resources">跳到资源列表</a>
    <header class="site-header shell">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">M</span> MOYU <span class="brand-note">摸鱼指挥部</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a href="./" aria-current="page">发现</a>
        <a href="./games/">小游戏</a>
        <a href="./pages/">静态页</a>
      </nav>
    </header>
    <main class="shell">
      <section class="welcome" aria-labelledby="welcome-title">
        <div>
          <p class="eyebrow">给忙碌按个暂停</p>
          <h1 id="welcome-title">摸一会儿鱼，<span>快乐一下。</span></h1>
          <p class="intro">小游戏、解压互动和有趣的页面。挑一个喜欢的，马上开始。</p>
        </div>
        <a class="resume-link" data-resource-resume hidden><span>上次玩过</span><strong></strong><span aria-hidden="true">继续打开 ↗</span></a>
      </section>

      <section class="resource-section" id="resources" aria-labelledby="resource-heading">
        <div class="section-heading">
          <div><p class="eyebrow">发现一点乐趣</p><h2 id="resource-heading">摸鱼资源</h2></div>
          <button class="action secondary random-button" type="button" data-resource-random="all"><span aria-hidden="true">↗</span> 随便玩一个</button>
        </div>
        <div class="catalog-toolbar">
          <div class="catalog-filters" data-resource-filters="all" aria-label="资源分类"></div>
          <div class="search-box">
            <label class="sr-only" for="resource-search">搜索摸鱼资源</label>
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="resource-search" type="search" data-resource-search="all" placeholder="搜索名称、玩法或标签" />
            <button type="button" class="clear-search" data-resource-clear="all" aria-label="清空搜索" hidden>×</button>
          </div>
        </div>
        <div class="results-heading"><span data-resource-count="all" role="status" aria-live="polite"></span><span>点击卡片，直接开始</span></div>
        <div class="portal-grid" data-resource-list="all"></div>
        <noscript><p>请启用 JavaScript 查看资源列表，或浏览 <a href="./games/">小游戏仓</a>。</p></noscript>
      </section>

      <section class="extras" aria-label="摸鱼小角落">
        <article class="extra-panel daily-panel">
          <p class="eyebrow">今日小提醒</p>
          <div class="daily-heading"><h2>慢一点，也没关系</h2><time id="today-label"></time></div>
          <p id="today-tip" class="muted">先喝口水，再继续。</p>
          <details class="calendar-details">
            <summary>查看本月日历 <span id="calendar-month-label"></span></summary>
            <div class="calendar-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="calendar-grid" id="calendar-grid" aria-label="本月日历"></div>
          </details>
        </article>
        <article class="extra-panel joke-panel">
          <div class="extra-heading"><p class="eyebrow">工位快乐补给</p><button class="text-button" id="refresh-joke" type="button">换一条 ↻</button></div>
          <blockquote class="joke-card"><p id="joke-text"></p><footer id="joke-source"></footer></blockquote>
        </article>
      </section>
    </main>
    <footer class="site-footer shell">
      <p>MOYU · 给日常留一点快乐</p>
      <details class="follow-details"><summary>关注摸鱼小宇宙 ↗</summary><div class="follow-content"><img src="./assets/images/moyu-xiaoyuzhou-qr.jpg" alt="摸鱼小宇宙公众号二维码" width="144" height="144" loading="lazy" /><p>扫一扫，收下新的小游戏与摸鱼灵感。</p><a href="./assets/images/moyu-xiaoyuzhou-qr.jpg" target="_blank" rel="noreferrer">打开二维码大图 ↗</a></div></details>
    </footer>
    <script src="assets/js/resources.js"></script>
    <script src="assets/js/catalog.js"></script>
    <script src="assets/js/home.js"></script>
  </body>
</html>
